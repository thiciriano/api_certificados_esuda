# blueprint do render: sobe a API + banco postgres persistente
# (Dashboard > New > Blueprint > apontar pra este repo)
services:
  - type: web
    name: esuda-certificados
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esuda-db
          property: connectionString
      # chave gerada pelo render (Settings cai do .env, aqui vira envVar)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DB_ECHO
        value: "false"
    healthCheckPath: /health

databases:
  - name: esuda-db
    plan: free   # postgres persistente (os dados sobrevivem a redeploy)
